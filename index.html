<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lembranças</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--w:170px;--h:238px}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#2a1a1f;overscroll-behavior:none}
body{background:radial-gradient(circle at 50% 40%,#4a2a33,#1e1216 75%);font-family:'Caveat',cursive;color:#f3e3c3;touch-action:pan-y;user-select:none}
#wrap{height:calc(100% - 64px);display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:calc(var(--w)*2);height:var(--h);position:relative;transition:transform .9s cubic-bezier(.5,0,.2,1);flex:none}
#book{position:absolute;left:50%;top:0;width:var(--w);height:var(--h);perspective:1400px}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,0,.2,1)}
.leaf.f{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{transform:rotateY(180deg)}
.pg{background:#fbf4e4 radial-gradient(#e6d9bd 1px,transparent 1.3px) 0 0/12px 12px;color:#6b3b44;padding:calc(var(--w)*.09);display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;gap:4px}
.right{border-radius:0 6px 6px 0;box-shadow:inset 10px 0 12px -8px rgba(60,30,20,.35)}
.left{border-radius:6px 0 0 6px;box-shadow:inset -10px 0 12px -8px rgba(60,30,20,.35)}
.cover{background:linear-gradient(135deg,#8c3745,#5d1f2c 60%,#471722);border-radius:3px 10px 10px 3px;box-shadow:inset 6px 0 10px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%;cursor:pointer}
.cover::before{content:"";position:absolute;inset:6%;border:1.5px solid #d9b26a;border-radius:3px 7px 7px 3px;opacity:.8;pointer-events:none}
.cover h1{font:400 calc(var(--w)*.27)/1 'Great Vibes',cursive;color:#e8c47e;margin:0 0 8%;text-shadow:0 1px 0 #3a0f19}
.cover p{font:500 calc(var(--w)*.095)/1.25 'Caveat',cursive;color:#f6e6c8;margin:0}
.cover i{position:absolute;bottom:11%;font:normal calc(var(--w)*.075)/1 'Caveat';color:#e8c47e;animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.ph{position:relative;background:#fff;padding:4% 4% 14%;box-shadow:0 2px 6px rgba(70,40,30,.3);width:78%;transform:rotate(var(--r,-2deg))}
.ph.s{width:60%}.ph.w{width:86%}
.ph label{display:flex;aspect-ratio:1/1;background:#f1e6d0 center/cover no-repeat;align-items:center;justify-content:center;font-size:calc(var(--w)*.2);color:#c9a98a;cursor:pointer}
.ph.w label{aspect-ratio:4/3}
.ph input{display:none}
.ph::before{content:"";position:absolute;top:-7px;left:50%;width:34%;height:12px;margin-left:-17%;background:rgba(226,190,120,.7);transform:rotate(3deg)}
.ph em{position:absolute;bottom:2%;left:0;right:0;text-align:center;font:500 calc(var(--w)*.085)/1 'Caveat';font-style:normal;color:#6b3b44}
.row{display:flex;gap:6%;width:100%;justify-content:center}
.row .ph{width:46%}
.t{font:calc(var(--w)*.2)/1 'Great Vibes',cursive;text-align:center;margin:0;color:#8c3745}
.n{position:absolute;bottom:3%;font:calc(var(--w)*.07)/1 'Caveat';color:#b69a84}
.left .n{left:8%}.right .n{right:8%}
#nav{height:64px;display:flex;align-items:center;justify-content:center;gap:22px}
#nav button{width:46px;height:46px;border-radius:50%;border:1.5px solid #d9b26a;background:transparent;color:#e8c47e;font-size:22px;line-height:1}
#nav button:disabled{opacity:.25}
#cnt{min-width:70px;text-align:center;font-size:20px;color:#e8c47e}
#fs{display:none;position:fixed;inset:0;z-index:100;background:rgba(15,8,10,.95);align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#fs img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="book"></div></div></div>
<div id="nav"><button id="pv" aria-label="Voltar">‹</button><span id="cnt"></span><button id="nx" aria-label="Avançar">›</button><button id="mu" aria-label="Música" style="font-size:18px">♫</button></div>
<audio id="au" src="fundo.mp3" loop preload="auto"></audio>
<div id="fs"><img alt=""></div>
<script>
var CAP=["Nossos momentos"],N=0;
var LAY=["A","B","C","A","B","A","C","B","A","E"];
var rot=[-3,2,-2,3,-1,2];
function ph(f,s,cls,r){var no=++N,k="lb"+f+"_"+s,v="";try{v=localStorage.getItem(k)||""}catch(e){}
return '<div class="ph '+cls+'" style="--r:'+r+'deg"><label data-n="'+no+'" data-k="'+k+'"'+(v?' style="background-image:url('+v+')"':'')+'>'+(v?'':'+')+'<input type="file" accept="image/*"></label><em>'+CAP[(f+s)%CAP.length]+'</em></div>'}
function face(f,side){var L=LAY[f],h='';
if(L=="A")h=ph(f,0,'',rot[f%6])+'<p class="t">'+CAP[0]+'</p>';
else if(L=="B")h='<div class="row">'+ph(f,0,'s',-3)+ph(f,1,'s',3)+'</div>'+ph(f,2,'w',-1);
else if(L=="C")h=ph(f,0,'w',2)+'<div class="row">'+ph(f,1,'s',-3)+ph(f,2,'s',2)+'</div>';
else h=ph(f,0,'',-2)+'<p class="t">Que venham mais<br>lembranças ♥</p>';
return '<div class="face pg '+side+(side=="left"?" back":"")+'">'+h+'<span class="n">'+(f+1)+'</span></div>'}
var b=document.getElementById("book"),html='';
html+='<div class="leaf" data-i="0"><div class="face cover" id="cv"><h1>Lembranças</h1><p>algo pra alegrar o seu dia e ter boas lembranças</p><i>toque para abrir ♥</i></div>'+face(0,"left").replace('class="face pg left back"','class="face pg left back"')+'</div>';
for(var k=1;k<=4;k++)html+='<div class="leaf" data-i="'+k+'">'+face(2*k-1,"right").replace("face pg right","face pg right")+face(2*k,"left")+'</div>';
html+='<div class="leaf" data-i="5">'+face(9,"right")+'</div>';
b.innerHTML=html;
var EX=["jpeg","jpg","png","webp"];
function tl(lb,n,i){if(i>=EX.length)return;var u=n+"."+EX[i],im=new Image();im.onload=function(){lb.style.backgroundImage='url("'+u+'")';lb.firstChild.nodeValue=""};im.onerror=function(){tl(lb,n,i+1)};im.src=u}
var lbs=b.querySelectorAll("label");for(var q=0;q<lbs.length;q++)if(!lbs[q].style.backgroundImage)tl(lbs[q],lbs[q].dataset.n,0);
var leaves=b.querySelectorAll(".leaf"),idx=0,S=1,st=document.getElementById("stage"),W=170;
function z(){for(var i=0;i<leaves.length;i++)leaves[i].style.zIndex=i<idx?i:20-i}
function go(n){if(n<0||n>5||n==idx)return;var a=idx;idx=n;
var lo=Math.min(a,n),hi=Math.max(a,n);
for(var i=0;i<leaves.length;i++)leaves[i].classList.toggle("f",i<idx);
setTimeout(z,420);if(n>a)leaves[a].style.zIndex=30;else leaves[n].style.zIndex=30;
upd()}
function upd(){st.style.transform=idx==0?'translateX('+(-W/2*S)+'px) scale('+S+')':idx==5?'translateX('+(W/2)+'px)':'none';
document.getElementById("cnt").textContent=idx==0?"capa":idx==5?"fim":"página "+(idx*2)+"–"+(idx*2+1);
document.getElementById("pv").disabled=idx==0;document.getElementById("nx").disabled=idx==5}
function fit(){var vw=innerWidth,vh=innerHeight-64-20;
W=Math.min((vw-16)/2,vh/1.4,260);var H=W*1.4;
var r=document.documentElement.style;r.setProperty("--w",W+"px");r.setProperty("--h",H+"px");
S=Math.max(1,Math.min((vw-32)/W,vh/H,2.1));upd()}
addEventListener("resize",fit);fit();z();
var au=document.getElementById("au"),mu=document.getElementById("mu"),on=true;
function play(){var p=au.play();if(p&&p.catch)p.catch(function(){})}
document.getElementById("cv").onclick=function(){go(1);if(on)play()};
mu.onclick=function(){on=!on;if(on)play();else au.pause();mu.style.opacity=on?1:.4};
var fs=document.getElementById("fs"),fi=fs.firstChild;
fs.onclick=function(){fs.style.display="none"};
b.addEventListener("click",function(e){var lb=e.target.closest&&e.target.closest("label");if(!lb)return;var bg=lb.style.backgroundImage;if(bg&&bg!=="none"){e.preventDefault();fi.src=bg.replace(/^url\(["']?|["']?\)$/g,"");fs.style.display="flex"}});
document.getElementById("nx").onclick=function(){go(idx+1)};
document.getElementById("pv").onclick=function(){go(idx-1)};
var x0=null;
document.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>50&&fs.style.display!="flex")go(d<0?idx+1:idx-1)},{passive:true});
b.addEventListener("change",function(e){var inp=e.target,lb=inp.parentNode,f=inp.files[0];if(!f)return;
var im=new Image(),u=URL.createObjectURL(f);
im.onload=function(){var m=700,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
var d=c.toDataURL("image/jpeg",.7);URL.revokeObjectURL(u);
lb.style.backgroundImage="url("+d+")";lb.firstChild.nodeValue="";
try{localStorage.setItem(lb.dataset.k,d)}catch(er){}};
im.src=u});
</script>
</body>
</html>
